}

* { box-sizing: border-box; }
body {

}
.card {
  background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--accent);

}
.card .lab {

}
.card.model { background: var(--ok-bg); border-left-color: var(--ok); }
.card.model .lab { color: var(--ok); }
.card.fresh { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
mark { background: var(--hl); color: var(--ink); font-weight: 600; padding: 0 .2em; border-radius: 4px; }
.card.model mark { background: transparent; color: inherit; font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* Commandes du bas */
.controls {
  position: sticky; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));

}
.btn {
  font: inherit; font-weight: 600; font-size: 18px; cursor: pointer; border-radius: 12px; padding: 10px 26px;

.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.keys { margin-left: auto; font-size: 13px; color: var(--muted); }
@media (max-width: 640px) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .card.fresh { animation: none; }
  .dimmable { transition: none; }

<script>
(function () {
  /* Documents */
  var DOC1 = '<div class="doc"><p class="doc-title">Doc. 1 · Le cycle de vie d\'un virus</p>'
    + '<ol class="steps">'
    + '<li class="dimmable" data-key="out"><span class="n">1</span><span>Fixation du virus sur sa cellule hôte</span></li>'

  var DOC3 = '<div class="doc"><p class="doc-title">Doc. 3 · Deux étapes de l\'action d\'un lymphocyte T sur une cellule infectée par un virus</p>'

        { model: true, html: 'Les anticorps des lymphocytes B agissent sur les antigènes libres dans l\'organisme. D\'après le document 1, le virus injecte son programme génétique dans la cellule et s\'y reproduit (étapes 2 à 4) : il est caché dans la cellule, où les anticorps ne l\'atteignent pas. Les lymphocytes B sont donc inefficaces contre un virus.' }
      ]
    },
    {
      id: "b1", tab: "b1", eyebrow: "Question 2 · Expérience b1", doc: DOC2,
      consigne: '2) <b>Analysez l\'expérience b1</b> du document 2.',
      steps: [
        { label: "Observation", doc: ["b1"], html: 'Les lymphocytes T de l\'expérience a sont mis avec des <mark>cellules non infectées</mark> : elles <mark>ne sont pas détruites</mark>.' },
        { label: "Conclusion", doc: ["b1"], html: 'Les lymphocytes T <mark>n\'attaquent pas les cellules saines</mark> de l\'organisme.' },
        { model: true, html: 'Les lymphocytes T prélevés chez la souris infectée, mis en présence de cellules non infectées, ne les détruisent pas : ils n\'attaquent pas les cellules saines.' }
      ]
    },
    {
      id: "b2", tab: "b2", eyebrow: "Question 2 · Expérience b2", doc: DOC2,

      steps: [
        { label: "Observation", doc: ["b2"], html: 'Mêmes lymphocytes T, mais les cellules sont maintenant <mark>infectées par le virus de la chorioméningite</mark> : elles sont <mark>détruites</mark>.' },

        { label: "Conclusion", doc: ["b2"], html: 'Les lymphocytes T <mark>détruisent les cellules infectées</mark> par le virus qui a déclenché leur production.' },
        { model: true, html: 'Les lymphocytes T mis en présence de cellules infectées par le virus de la chorioméningite détruisent ces cellules : ils détruisent les cellules infectées par le virus contre lequel ils ont été produits.' }

    },
    {

    },
    {

        { label: "On cherche", doc: ["b2"], html: 'Dans l\'expérience b2, ce qui détruit les cellules infectées, ce sont les <mark>lymphocytes T</mark>.' },
        { label: "Précision", html: 'Plus précisément les <mark>lymphocytes T cytotoxiques</mark> (notés Tc). Les lymphocytes B sont inefficaces contre un virus caché dans une cellule.' },

    {

        else els[i].classList.add("dim");

      if (seen[SLIDES[t].id]) tabs[t].classList.add("seen"); else tabs[t].classList.remove("seen");
    }

    var atStart = si === 0 && ri === 0;
    var atEnd = si === SLIDES.length - 1 && ri === s.steps.length;
    prevBtn.disabled = atStart;
    nextBtn.disabled = atEnd;
    var lastOfSlide = ri === s.steps.length;
    nextBtn.textContent = lastOfSlide && !atEnd ? "Question suivante →" : "Suivant →";
    countEl.textContent = "Écran " + (si + 1) + " / " + SLIDES.length + " · étape " + ri + " / " + s.steps.length;

    try {
      if (location.hash !== "#" + s.id) history.replaceState(null, "", "#" + s.id);
    } catch (e) {
      try { location.hash = s.id; } catch (e2) {}
    }
  }

  function next() {
    var s = SLIDES[si];
    if (ri < s.steps.length) { ri++; fresh = true; }
    else if (si < SLIDES.length - 1) { si++; ri = 0; fresh = false; window.scrollTo(0, 0); }
    else return;
    render();
  }

  function prev() {
    if (ri > 0) { ri--; fresh = false; }
    else if (si > 0) { si--; ri = SLIDES[si].steps.length; fresh = false; }
    else return;
    render();
  }

  nextBtn.addEventListener("click", next);
  prevBtn.addEventListener("click", prev);

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var onButton = e.target && e.target.closest && e.target.closest("button");
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    else if ((e.key === " " || e.key === "Enter") && !onButton) { e.preventDefault(); next(); }
    else if (e.key === "Home" && !onButton) { e.preventDefault(); si = 0; ri = 0; fresh = false; render(); }
  });

  function fromHash() {
    var h = (location.hash || "").replace("#", "");
    for (var i = 0; i < SLIDES.length; i++) {
      if (SLIDES[i].id === h) { if (i !== si) { si = i; ri = 0; fresh = false; } return; }
    }
  }
  window.addEventListener("hashchange", function () { fromHash(); render(); });

  /* Plein écran, si le navigateur l'autorise */
  var fsBtn = document.getElementById("fsBtn");
  if (document.fullscreenEnabled) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      try {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else {
          var p = document.documentElement.requestFullscreen();
          if (p && p.catch) p.catch(function () {});
        }
      } catch (e) {}
    });
  }

  fromHash();
  render();
})();
</script>

</body></html>
