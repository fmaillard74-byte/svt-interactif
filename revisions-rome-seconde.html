  font-family:var(--font-display);font-size:22px;box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 5px var(--gold2)}

.session-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--accent)}

.row{display:flex;gap:10px;flex-wrap:wrap}

.rate-bad{border:1px solid var(--bad)!important;color:var(--bad)!important}

.opt.ok{background:var(--good-bg);border-color:var(--good)}

.explain{background:var(--surface2);border-radius:10px;padding:12px 14px}
.qtext{font-family:var(--font-display);font-size:clamp(20px,4.2vw,24px);line-height:1.3}

ol.slots li.ok{border-color:var(--good);background:var(--good-bg)}
ol.slots li.ko{border-color:var(--bad);background:var(--bad-bg)}

ol.slots .yr{margin-left:auto;font-weight:600;white-space:nowrap}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px}
.pool button:hover{border-color:var(--accent)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.pairs{gap:8px}.pairs .opt{padding:10px;font-size:15px}}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt.done{background:var(--good-bg);border-color:var(--good);opacity:.75}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);color:var(--ink);font:inherit}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw span{border-radius:999px;padding:4px 12px;font-size:14px;border:1px solid var(--line)}
.kw .f{background:var(--good-bg);border-color:var(--good)}
.kw .m{background:var(--bad-bg);border-color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--font-display);font-weight:400;font-size:19px}
.mode span{color:var(--muted);font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,200px) 1fr 70px;gap:10px;align-items:center;font-size:14px}
@media (max-width:520px){.bar{grid-template-columns:1fr 1fr 56px}}
.bar .track{height:12px;background:var(--tile);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.outline{display:flex;flex-direction:column;gap:12px}
.outline h3{font-size:19px}
.outline ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.keybox{background:var(--surface2);border-radius:10px;padding:12px 14px}
.keybox b{font-weight:600}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.result{display:flex;flex-direction:column;gap:12px}
.result .big{font-family:var(--font-display);font-size:34px}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.mode,.pool button{transition:border-color .15s,background .15s,filter .15s}}
.denier{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.pc svg{width:100%;height:auto;display:block}
.pc text{font-family:var(--font-display);fill:var(--ink)}
.pc [data-k]{cursor:pointer}
.pc [data-k]:hover .hot,.pc [data-k].on .hot{stroke:var(--accent);stroke-width:3}
.hot{fill:none;stroke:transparent}
.disc{fill:var(--gold2);stroke:var(--gold);stroke-width:3}
.fig{fill:var(--gold);opacity:.85}
.expl{background:var(--surface2);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;min-height:48px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.id{background:var(--surface2);border-radius:12px;padding:14px;min-width:0}
.id h4{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:18px}
.id ul{margin:0;padding-left:18px}
blockquote.q{margin:0;padding:12px 16px;border-left:4px solid var(--gold);background:var(--surface2);border-radius:0 8px 8px 0;font-family:var(--font-display);font-size:18px}
.idea{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.idea>div{border-radius:10px;padding:10px 12px;min-width:0}
.idea .ap{background:var(--good-bg)}.idea .re{background:var(--bad-bg)}
.idea .arr{background:none;align-self:center;color:var(--muted);padding:0}
@media(max-width:560px){.denier,.two{grid-template-columns:1fr}.idea{grid-template-columns:1fr}.idea .arr{transform:rotate(90deg);justify-self:center}}
</style>

<script>
(function(){
"use strict";

/* ---------- utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs){
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const TODAY = () => new Date().toLocaleDateString('sv-SE');
const addDays = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.toLocaleDateString('sv-SE'); };
const diffDays = (a,b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const hash = s => { let x=5381; for (let i=0;i<s.length;i++) x=((x<<5)+x+s.charCodeAt(i))|0; return (x>>>0).toString(36); };
const plural = (n,w) => n + ' ' + w + (n>1 ? 's' : '');

/* ---------- content ---------- */
const THEMES = {
  intro:'Contexte',
  aug:'Auguste et le principat',
  doc:'Doc 2 : propagande',
  emp:'Empire multiculturel',
  rel:'Religions',
  con:'Constantin'
};

const CARDS = [
 ['intro','Au IIIe siècle av. J.-C., quel est le régime de Rome ?','Une <b>république</b> qui entreprend de vastes conquêtes.'],
 ['intro','Que contrôle Rome au Ier siècle av. J.-C. ?','<b>Presque tout le bassin méditerranéen</b>.'],
 ['intro','Pourquoi les victoires mènent-elles aux guerres civiles ?','Elles <b>renforcent le pouvoir des généraux</b>, qui se disputent le pouvoir.'],
 ['intro','Qui succède à Jules César après son assassinat ?','<b>Octave</b>, son fils adoptif.'],
 ['aug','Quand Octave devient-il Auguste ? Quel régime met-il en place ?','En <b>27 av. J.-C.</b> : le <b>principat</b> (ou empire), où il concentre tous les pouvoirs.'],
 ['aug','Pourquoi Auguste garde-t-il les apparences de la République ?','Le peuple romain <b>rejette violemment toute forme de monarchie</b>.'],
 ['aug','Que signifie « princeps » ?','« <b>Premier</b> » des sénateurs : titre d\'Auguste.'],
 ['aug','Cite 4 moyens par lesquels Auguste domine le Sénat.','1) Il peut <b>s\'opposer</b> à toutes ses décisions. 2) Titre de <b>princeps</b>. 3) Il <b>désigne</b> les membres du Sénat. 4) Élu <b>censeur</b>, il choisit qui y entre.'],
 ['aug','Qu\'est-ce qu\'un censeur ?','Un magistrat qui peut <b>choisir les membres du Sénat</b>.'],
 ['aug','Qu\'est-ce que l\'« imperator » ? Depuis quand Auguste l\'est-il ?','Le <b>chef des armées</b>, depuis <b>29 av. J.-C.</b> (rôle normalement du consul).'],
 ['aug','Que permet le titre de tribun à vie ?','<b>S\'opposer à tout</b> (droit de veto).'],
 ['aug','Pourquoi dit-on que le principat est une « monarchie qui ne dit pas son nom » ?','Auguste garde les institutions républicaines (Sénat, magistrats…) mais il les <b>contrôle toutes</b>.'],
 ['doc','Res Gestae : auteur, nature, date ?','Écrites par <b>Auguste lui-même</b> ; texte <b>autobiographique</b>, sorte de testament ; Ier siècle.'],
 ['doc','À qui s\'adressent les Res Gestae ?','À son <b>héritier</b>, mais aussi pour <b>convaincre tous les Romains</b>.'],
 ['doc','Quelles sont les 3 idées de propagande des 2 documents ?','1) Il met en avant le <b>Sénat et le peuple romain</b> : il « respecte les institutions ». 2) Il se place <b>au même niveau que ses collègues</b>. 3) Il a <b>servi la République</b> : bénéfice collectif, non individuel.'],
 ['doc','Que signifie S.P.Q.R. ? Où est-ce sur la monnaie ?','<i>Senatus Populusque Romanus</i> : « le Sénat et le peuple romain », devise de la République. Au <b>revers</b> du denier, avec le char triomphal.'],
 ['doc','Décris le denier d\'argent (lieu, date, avers, revers).','Frappé à <b>Colonia Patricia (Cordoue)</b>, <b>19-18 av. J.-C.</b>. Avers : buste d\'Octave entouré de ses surnoms (César, Auguste). Revers : char triomphal + S.P.Q.R.'],
 ['doc','Quelle phrase des Res Gestae montre qu\'Auguste se place au niveau de ses collègues ?','« supérieur à tous les autres par la dignité et l\'autorité, mais [il n\'avait] pas de pouvoir plus grand que celui de [ses] collègues ».'],
 ['doc','Conclusion : que reste-t-il vrai malgré la propagande ?','Auguste est <b>le seul détenteur du pouvoir</b>. À sa mort, <b>Tibère</b> reprend ses titres et fonctions : l\'empire s\'enracine.'],
 ['doc','Doc 2 : quels sont les deux documents et leur point commun ?','Un texte (les <b>Res Gestae</b>) et une monnaie (le <b>denier d\'argent</b>). Point commun : de la <b>propagande</b> pour montrer qu\'Auguste respecte les institutions.'],
 ['doc','Propagande : définition (à partir du Doc 2) ?','Ensemble de textes, d\'images ou de monnaies destinés à <b>faire accepter un pouvoir</b> en donnant une image favorable du chef.'],
 ['doc','Idée 1 : ce que montre Auguste / ce qu\'il en est vraiment ?','Il met en avant le <b>Sénat et le peuple romain</b> (S.P.Q.R.) → mais en réalité il <b>domine le Sénat</b>.'],
 ['doc','Idée 2 : ce que montre Auguste / ce qu\'il en est vraiment ?','Il se dit <b>au niveau de ses collègues</b> → mais il est <b>princeps</b>, imperator, tribun à vie : il garde <b>tous les pouvoirs</b>.'],
 ['doc','Idée 3 : ce que montre Auguste / ce qu\'il en est vraiment ?','Il a <b>servi la République</b> (bénéfice collectif) → mais il est <b>le seul détenteur du pouvoir</b>.'],
 ['doc','Qu\'y a-t-il sur l\'avers du denier ?','Le <b>buste d\'Octave</b>, entouré de ses surnoms (<b>César, Auguste</b>).'],
 ['doc','Qu\'y a-t-il sur le revers du denier ?','Un <b>char triomphal</b> et l\'inscription <b>S.P.Q.R.</b>'],
 ['emp','Comment l\'empire est-il sécurisé ?','Installation de <b>légions</b> et construction de <b>murs aux frontières</b> les plus éloignées.'],
 ['emp','Quel est le rôle des gouverneurs ?','Ils appliquent les <b>lois impériales</b> dans leurs provinces et <b>améliorent les conditions de vie</b> : adhésion au régime, armée qui intervient vite.'],
 ['emp','À quoi sert la citoyenneté romaine pour un provincial ?','Exercer des <b>fonctions politiques</b> locales, puis entrer au <b>Sénat</b> : il participe à l\'empire et devient <b>fidèle</b>.'],
 ['emp','Qu\'est-ce que Caracalla décide en 212 ?','Il donne la <b>citoyenneté romaine à tous les hommes libres</b> de l\'empire.'],
 ['emp','Qu\'est-ce que la romanisation ?','L\'intégration de la culture des régions conquises et la <b>diffusion de l\'architecture</b> et du mode de vie romains.'],
 ['emp','Qu\'est-ce que l\'ascension sociale dans l\'empire ?','La possibilité de monter dans la société grâce à la citoyenneté : certains <b>empereurs en sont issus</b>.'],
 ['emp','Que signifie « pax romana » ?','La <b>paix romaine</b> : paix à l\'intérieur de l\'empire (IIe-IIIe siècle dans ton cours).'],
 ['rel','Qu\'est-ce que le culte de l\'empereur ?','Un culte qui <b>rassemble les habitants</b> de l\'empire autour de l\'empereur.'],
 ['rel','Quelle tension religieuse traverse l\'empire ?','Les <b>religions polythéistes</b> (ex. culte d\'Isis) contre les <b>monothéistes</b> (juifs, chrétiens).'],
 ['rel','Pourquoi les chrétiens sont-ils persécutés ?','Ils sont <b>monothéistes</b> et refusent le culte de l\'empereur. Pourtant, la <b>communauté chrétienne s\'étend</b>.'],
 ['con','Constantin : empereur de quelle date à quelle date ?','De <b>306</b> à <b>337</b>.'],

function loadLocal(){ try { const r = localStorage.getItem(LS_KEY); if (r) return JSON.parse(r); } catch(e){} return null; }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
function persist(){
  S.updated = Date.now(); saveLocal();
  if (!dbDoc) return;
  dirty = true; if (!saving) flush();
}
async function flush(){
  saving = true;
  while (dirty){ dirty = false; try { await dbDoc.set({ json: JSON.stringify(S), updated: S.updated }); } catch(e){} }
  saving = false;
}
async function initDb(){
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    dbDoc = db.collection('data/users/' + id).doc('progress');
    const snap = await dbDoc.get();
    if (snap.exists){
      const r = snap.data(); const remote = r && r.json ? JSON.parse(r.json) : null;
      if (remote && (remote.updated||0) > (S.updated||0)){ S = Object.assign({ start:null, cards:{}, q:{}, days:{} }, remote); saveLocal(); if (!busy) renderAll(); }
      else if (S.updated > ((remote && remote.updated)||0)) persist();
    } else if (S.updated) persist();
  } catch(e){}
}

/* ---------- derived data ---------- */
const dayNo = () => S.start ? diffDays(S.start, TODAY()) + 1 : 1;
function streak(){
  let d = TODAY(); if (!(S.days[d] && S.days[d].done)) d = addDays(d,-1);
  let n = 0; while (S.days[d] && S.days[d].done){ n++; d = addDays(d,-1); } return n;
}
const boxOf = id => (S.cards[id] ? S.cards[id].b : 0);
const isDue = (id,today) => S.cards[id] && S.cards[id].d <= today;
function themeStats(){
  const out = {}; for (const k in THEMES) out[k] = { ok:0, ko:0 };
  for (const q of QUIZ){ const s = S.q[q.id]; if (s){ out[q.th].ok += s.ok||0; out[q.th].ko += s.ko||0; } }
  return out;
}

/* ---------- engines ---------- */
function runCards(el, list, done){
  const total = list.length; let queue = list.slice(), known = 0, flipped = false;
  function rate(c, kind){
    const today = TODAY(); const cur = S.cards[c.id] || { b:0, d:today };
    let b = cur.b, first = !c._again;
    if (kind === 'again'){ b = 1; if (!c._again){ c._again = true; queue.push(c); } }
    else if (kind === 'hesitant'){ b = Math.max(1, b); }
    else { b = cur.b === 0 ? 2 : Math.min(5, b + 1); if (first) known++; }
    S.cards[c.id] = { b, d: addDays(today, Math.max(1, INT[b])) };
    persist(); queue.shift(); flipped = false; show();
  }
  function show(){
    if (!queue.length) return done({ score: known, total });
    const c = queue[0];
    const back = h('div',{class:'a',html:c.a});
    back.hidden = !flipped;
    const actions = flipped
      ? h('div',{class:'row'},
          h('button',{class:'btn ghost rate-bad',onclick:()=>rate(c,'again')},'À revoir (1)'),
          h('button',{class:'btn ghost',onclick:()=>rate(c,'hesitant')},'Hésitant (2)'),
          h('button',{class:'btn rate-good',onclick:()=>rate(c,'good')},'Je savais (3)'))
      : h('div',{class:'row'}, h('button',{class:'btn',onclick:()=>{ flipped = true; show(); }},'Voir la réponse (espace)'));
    el.replaceChildren(
      h('div',{class:'meta'},h('span',{class:'tag'},THEMES[c.th]),h('span',{},`Il reste ${plural(queue.length,'carte')}`)),
      h('div',{class:'flash'},h('div',{class:'q'},c.q),back),
      actions,
      h('p',{class:'hint'},'Dis la réponse à voix haute avant de la révéler. Les cartes ratées reviennent demain.')
    );
  }
  el._key = e => {
    if (!queue.length) return;
    if (!flipped && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); flipped = true; show(); }
    else if (flipped && ['1','2','3'].includes(e.key)) rate(queue[0], ['again','hesitant','good'][+e.key-1]);
  };
  show();
}

function runQuiz(el, list, done){
  let i = 0, score = 0;
  function show(){
    if (i >= list.length) return done({ score, total: list.length });
    const q = list[i];
    const order = q.t === 'vf' ? [0,1] : shuffle([0,1,2,3]);
    const box = h('div',{class:'opts'}); const fb = h('div'); let answered = false;
    order.forEach(idx => {
      const b = h('button',{class:'opt'}, q.o[idx]);
      b.addEventListener('click', () => {
        if (answered) return; answered = true;
        const ok = idx === q.c; if (ok) score++;
        const st = S.q[q.id] || { ok:0, ko:0 }; st[ok ? 'ok' : 'ko']++; S.q[q.id] = st; persist();
        [...box.children].forEach((bb,k) => { bb.disabled = true; if (order[k] === q.c) bb.classList.add('ok'); else if (bb === b) bb.classList.add('ko'); });
        fb.replaceChildren(
          h('div',{class:'explain'}, h('b',{}, ok ? 'Bonne réponse. ' : 'Pas tout à fait. '), h('span',{html:q.e})),
          h('div',{class:'row',style:'margin-top:12px'}, h('button',{class:'btn',onclick:()=>{ i++; show(); }}, i+1 >= list.length ? 'Terminer' : 'Question suivante'))
        );
      });
      box.append(b);
    });
    el.replaceChildren(
      h('div',{class:'meta'},h('span',{class:'tag'}, (q.t==='vf'?'Vrai ou faux · ':'') + THEMES[q.th]),h('span',{},`${i+1} / ${list.length}`)),
      h('p',{class:'qtext'}, q.q), box, fb);
  }
  show();
}

function runFrise(el, set, done){
  const items = shuffle(set.items.map((x,r) => Object.assign({ r }, x)));
  const slots = []; let checked = false;
  function draw(){
    const n = set.items.length;
    const ol = h('ol',{class:'slots'});
    for (let k=0;k<n;k++){
      const it = slots[k];
      const li = h('li',{ class: it ? 'filled' : '' }, h('span',{class:'n'}, String(k+1)), it ? it.t : h('span',{class:'muted'},'Touche un événement ci-dessous'));
      if (it && checked){ li.classList.add(it.r === k ? 'ok' : 'ko'); li.append(h('span',{class:'yr'}, it.y)); li.style.cursor='default'; }
      else if (it) li.addEventListener('click', () => { slots.splice(k,1); draw(); });
      ol.append(li);
    }
    const pool = h('div',{class:'pool'});
    items.filter(x => !slots.includes(x)).forEach(x => pool.append(h('button',{onclick:()=>{ slots.push(x); draw(); }}, x.t)));
    let foot;
    if (!checked){
      foot = h('div',{class:'row'}, h('button',{class:'btn',disabled:slots.length<n,onclick:()=>{ checked = true; draw(); }},'Vérifier l\'ordre'));
    } else {
      const sc = slots.filter((x,k) => x.r === k).length;
      foot = h('div',{class:'result'},
        h('p',{}, h('b',{}, `${sc} sur ${n} bien placés.`)),
        h('div',{class:'keybox'}, h('b',{},'Ordre correct : '), set.items.map(x => `${x.y} ${x.t}`).join(' → ')),
        h('div',{class:'row'}, h('button',{class:'btn',onclick:()=>done({ score: sc, total: n })},'Continuer')));
    }
    el.replaceChildren(
      h('div',{class:'meta'},h('span',{class:'tag'},'Frise'),h('span',{},set.title)),
      h('p',{class:'qtext'},'Remets les événements dans l\'ordre chronologique.'),
      ol, checked ? null : pool, foot);
  }
  draw();
}

function runPairs(el, set, done){
  const n = set.length; const L = shuffle(set.map((p,i)=>({i,t:p[0]}))), R = shuffle(set.map((p,i)=>({i,t:p[1]})));
  let sl = null, sr = null, errors = 0, bad = null; const ok = new Set();
  function draw(){
    const mk = (side, arr, sel) => h('div',{class:'col'}, arr.map(x => {
      const cls = ['opt']; if (ok.has(x.i)) cls.push('done'); else if (sel === x.i) cls.push('sel');
      if (bad && bad[side] === x.i) cls.push('bad');
      return h('button',{class:cls.join(' '),disabled:ok.has(x.i),onclick:()=>pick(side,x.i)}, x.t);
    }));
    const finished = ok.size === n;
    el.replaceChildren(
      h('div',{class:'meta'},h('span',{class:'tag'},'Associations'),h('span',{},`${ok.size} / ${n} · ${plural(errors,'erreur')}`)),
      h('p',{class:'qtext'},'Relie chaque mot à sa définition.'),
      h('div',{class:'pairs'}, mk('l',L,sl), mk('r',R,sr)),
      finished ? h('div',{class:'row'}, h('button',{class:'btn',onclick:()=>done({ score: Math.max(0,n-errors), total:n })},'Continuer')) : null);
  }
  function pick(side,i){
    if (side==='l') sl = sl===i ? null : i; else sr = sr===i ? null : i;
    if (sl!=null && sr!=null){
      if (sl===sr){ ok.add(sl); sl = sr = null; }
      else { errors++; bad = { l:sl, r:sr }; sl = sr = null; setTimeout(()=>{ bad=null; draw(); }, 600); }
    }
    draw();
  }
  draw();
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’]/g,"'").replace(/\./g,'');
function runWrite(el, w, done){
  const ta = h('textarea',{id:'wr-text',placeholder:'Écris 3 à 5 phrases, sans regarder la fiche.'});
  const out = h('div'); let checked = false;
  function check(){
    const t = norm(ta.value); const res = w.kw.map(k => [k[0], k[1].some(s => t.includes(s))]);
    const found = res.filter(x => x[1]).length; checked = true;
    out.replaceChildren(
      h('p',{}, h('b',{}, `${found} mots-clés sur ${res.length}.`), ' Les mots manquants sont à placer dans ta prochaine tentative.'),
      h('div',{class:'kw'}, res.map(x => h('span',{class:x[1]?'f':'m'}, (x[1]?'✓ ':'✗ ') + x[0]))),
      h('details',{style:'margin-top:12px'}, h('summary',{},'Voir un modèle de réponse'), h('p',{class:'explain',style:'margin-top:8px',html:w.m})),
      h('div',{class:'row',style:'margin-top:12px'}, h('button',{class:'btn',onclick:()=>done({ score: found, total: res.length })},'Continuer')));
  }
  el.replaceChildren(
    h('div',{class:'meta'},h('span',{class:'tag'},'Rédiger'),h('span',{},'Sans filet')),
    h('p',{class:'qtext'},w.q), ta,
    h('div',{class:'row'}, h('button',{class:'btn',onclick:check},'Vérifier mes mots-clés')), out);
}

/* ---------- session & practice ---------- */
function weightedQuiz(pool, n){
  return pool.map(q => { const s = S.q[q.id]; const w = s ? (s.ko - 0.5*s.ok) : 1.5; return [q, w + Math.random()*0.9]; })
    .sort((a,b) => b[1]-a[1]).slice(0,n).map(x => x[0]);
}
function pickCards(pool, max, maxNew){
  const today = TODAY();
  const due = pool.filter(c => isDue(c.id,today)).sort((a,b) => boxOf(a.id)-boxOf(b.id));
  let pick = due.slice(0,max);
  const fresh = pool.filter(c => !S.cards[c.id]);
  pick = pick.concat(fresh.slice(0, Math.min(max - pick.length, maxNew)));
  if (pick.length < Math.min(8,max)){
    const rest = pool.filter(c => !pick.includes(c) && S.cards[c.id]).sort((a,b) => boxOf(a.id)-boxOf(b.id) || S.cards[a.id].d.localeCompare(S.cards[b.id].d));
    pick = pick.concat(rest.slice(0, Math.min(8,max) - pick.length));
  }
  return pick;
}
function gameFor(n, random){
  const g = random ? Math.floor(Math.random()*4) : (n-1) % 4; const k = random ? Math.floor(Math.random()*9) : Math.floor((n-1)/4);
  if (g === 0){ const s = FRISES[k % FRISES.length]; return { name:'Frise chronologique', run:(el,d)=>runFrise(el,s,d) }; }
  if (g === 1){ const s = shuffle(PAIRS).slice(0,6); return { name:'Associations', run:(el,d)=>runPairs(el,s,d) }; }
  if (g === 2){ const w = WRITES[k % WRITES.length]; return { name:'Rédiger sans filet', run:(el,d)=>runWrite(el,w,d) }; }
  const v = shuffle(QUIZ.filter(q => q.t==='vf')).slice(0,6); return { name:'Vrai ou faux', run:(el,d)=>runQuiz(el,v,d) };
}
function buildPlan(bonus){
  const cards = pickCards(CARDS, 10, 5);
  const quiz = weightedQuiz(QUIZ.filter(q => q.t==='mc'), 6);
  return { cards, quiz, game: gameFor(dayNo() + (bonus ? 1 : 0), bonus) };
}

let keyHandler = null;
document.addEventListener('keydown', e => { if (keyHandler && !/textarea|input/i.test(e.target.tagName)) keyHandler(e); });

function panelShell(titleSteps, onQuit){
  const bar = h('div',{class:'steps'}); const body = h('div',{class:'result',style:'gap:16px'});
  const frame = h('section',{class:'panel'}, h('div',{class:'session-head'}, bar, h('button',{class:'btn ghost small',onclick:onQuit},'Quitter')), body);
  return { frame, bar, body };
}
const quitTo = () => { busy = false; keyHandler = null; renderAll(); };

function startSession(bonus){
  busy = true; if (!S.start){ S.start = TODAY(); persist(); }
  const P = buildPlan(bonus); const steps = [];
  if (P.cards.length) steps.push({ name:`Cartes · ${P.cards.length}`, run:(el,d)=>{ runCards(el,P.cards,d); keyHandler = el._key; } });
  steps.push({ name:`QCM · ${P.quiz.length}`, run:(el,d)=>{ keyHandler = null; runQuiz(el,P.quiz,d); } });
  steps.push({ name:P.game.name, run:(el,d)=>{ keyHandler = null; P.game.run(el,d); } });
  const sh = panelShell(null, quitTo); view.replaceChildren(sh.frame);
  let k = 0; const results = [];
  const drawBar = () => sh.bar.replaceChildren(...steps.map((s,i) => h('span',{class: i<k?'past':(i===k?'on':'')}, s.name)));
  function next(){
    drawBar(); if (k >= steps.length) return finish();
    const s = steps[k]; const el = h('div',{class:'result'}); sh.body.replaceChildren(el);
    s.run(el, r => { results.push(Object.assign({ name:s.name }, r)); k++; window.scrollTo(0,0); next(); });
  }
  function finish(){
    keyHandler = null; const today = TODAY();
    const tot = results.reduce((a,r)=>a+r.total,0), sc = results.reduce((a,r)=>a+r.score,0);
    S.days[today] = { done:true, score:sc, total:tot }; persist();
    sh.bar.replaceChildren(h('span',{class:'past'},'Séance terminée'));
    const due = CARDS.filter(c => S.cards[c.id] && S.cards[c.id].d <= addDays(today,1)).length;
    sh.body.replaceChildren(
      h('p',{class:'eyebrow'},`Jour ${dayNo()} validé`),
      h('p',{class:'big',style:'font-family:var(--font-display);font-size:32px'}, `${sc} bonnes réponses sur ${tot}`),
      h('div',{class:'grid2'}, results.map(r => h('div',{class:'kpi'}, h('b',{},`${r.score}/${r.total}`), h('span',{},r.name)))),
      h('p',{class:'muted'}, `Demain, ${plural(due,'carte')} reviendr${due>1?'ont':'a'}. Les erreurs de QCM sont prioritaires dans la prochaine séance.`),
      h('div',{class:'row'}, h('button',{class:'btn',onclick:quitTo},'Retour à l\'accueil')));
  }
  next();
}

const view = $('#view');
function mosaic(){
  const today = TODAY(); const start = S.start || today; const wrap = h('div',{class:'mosaic','aria-label':'14 jours de révision'});
  for (let i=0;i<14;i++){
    const d = addDays(start,i); const done = S.days[d] && S.days[d].done;
    const cls = done ? 'done' : (d === today ? 'today' : (d < today ? 'miss' : ''));
    wrap.append(h('i',{class:cls,title:`Jour ${i+1}`}));
  }
  const nd = Object.values(S.days).filter(x=>x.done).length;
  return h('div',{class:'mosaic-wrap'}, wrap, h('p',{class:'cap'}, `${nd} jour${nd>1?'s':''} validé${nd>1?'s':''} sur 14`));
}

  }},'Réinitialiser ma progression');
  view.replaceChildren(
    h('section',{class:'panel'}, h('h3',{},'Les 14 jours'), mosaic(), h('p',{class:'muted'}, `Série en cours : ${plural(streak(),'jour')}.`)),
    h('section',{class:'panel'}, h('h3',{},'Mémoire des cartes'), h('div',{class:'bars'}, counts.map((v,i) => bar(labels[i],v,CARDS.length,`${v}`)))),
    h('section',{class:'panel'}, h('h3',{},'Réussite aux QCM par thème'), h('div',{class:'bars'}, Object.entries(THEMES).map(([k,l]) => {
      const v = ts[k], n = v.ok+v.ko; return bar(l, v.ok, n, n ? `${Math.round(100*v.ok/n)} % · ${n}` : '–'); })),
      weak.length ? h('div',{class:'keybox'}, h('b',{},'À retravailler : '), weak.map(([k]) => THEMES[k]).join(', '), '. Va dans « S\'entraîner » et choisis ce thème.') : h('p',{class:'hint'},'Les thèmes à retravailler apparaissent après quelques réponses.')),
    h('div',{}, reset));
}

const DENIER = {
  av:['Avers (face)','Le <b>buste d\'Octave</b>, entouré de ses surnoms : <b>César</b> et <b>Auguste</b>. Le chef est mis en avant, mais sous un nom qui rappelle la tradition.'],
  nom:['Les surnoms','<b>César</b> (héritage de son père adoptif) et <b>Auguste</b> (titre reçu en 27 av. J.-C.) : le pouvoir d\'un seul s\'affiche déjà.'],
  rev:['Revers (pile)','Un <b>char triomphal</b> : Auguste est le général victorieux qui a servi Rome.'],
  spqr:['S.P.Q.R.','<i>Senatus Populusque Romanus</i> : « le Sénat et le peuple romain », devise de la <b>République</b>. C\'est l\'idée n° 1 de propagande : il respecte les institutions.'],
  lieu:['Lieu et date','Frappé à <b>Colonia Patricia (Cordoue)</b>, en <b>19-18 av. J.-C.</b>, en argent : une monnaie qui circule partout et diffuse l\'image du pouvoir.']
};
function viewDoc(){
  const coin = `<div class="denier">
   <div class="pc"><svg viewBox="0 0 200 200" role="img" aria-label="Avers du denier : buste d'Octave"><circle class="disc" cx="100" cy="100" r="92"/>
     <g data-k="av"><circle class="fig" cx="100" cy="86" r="26"/><path class="fig" d="M52 160c4-30 24-40 48-40s44 10 48 40z"/><circle class="hot" cx="100" cy="112" r="50"/></g>
     <g data-k="nom"><path id="ring" d="M100 100m-80 0a80 80 0 1 1 160 0a80 80 0 1 1-160 0" fill="none"/><text font-size="15" letter-spacing="2"><textPath href="#ring" startOffset="2%">CAESAR · AVGVSTVS ·</textPath></text><circle class="hot" cx="100" cy="100" r="86" stroke-dasharray="6 6"/></g></svg>
     <p class="hint" style="text-align:center;margin:4px 0 0">AVERS</p></div>
   <div class="pc"><svg viewBox="0 0 200 200" role="img" aria-label="Revers du denier : char triomphal et S.P.Q.R."><circle class="disc" cx="100" cy="100" r="92"/>
     <g data-k="rev"><rect class="fig" x="52" y="92" width="76" height="26" rx="4"/><circle class="fig" cx="76" cy="124" r="14"/><path class="fig" d="M128 100l30-10 6 14-30 14z"/><circle class="hot" cx="104" cy="108" r="52"/></g>
     <g data-k="spqr"><text x="100" y="62" font-size="22" text-anchor="middle" letter-spacing="3">S P Q R</text><rect class="hot" x="52" y="40" width="96" height="28" rx="6"/></g>
     <g data-k="lieu"><text x="100" y="158" font-size="10" text-anchor="middle">CORDOUE · 19-18 av. J.-C.</text><rect class="hot" x="40" y="152" width="120" height="20" rx="6"/></g></svg>
     <p class="hint" style="text-align:center;margin:4px 0 0">REVERS</p></div></div>`;
  const expl = h('div',{class:'expl','aria-live':'polite'}, 'Touche une partie du denier pour comprendre à quoi elle sert.');
  const box = h('div',{}); box.innerHTML = coin;
  box.querySelectorAll('[data-k]').forEach(g => {
    g.setAttribute('tabindex','0'); g.setAttribute('role','button');
    const go = () => { const d = DENIER[g.dataset.k]; box.querySelectorAll('[data-k]').forEach(x=>x.classList.remove('on')); g.classList.add('on'); expl.innerHTML = '<b>'+d[0]+' :</b> '+d[1]; };
    g.addEventListener('click',go); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
  const idea = (n,ap,re) => h('div',{class:'idea'},
    h('div',{class:'ap'}, h('b',{},'Idée '+n+' · il montre'), h('p',{style:'margin:4px 0 0'},ap)),
    h('div',{class:'arr'},'→'),
    h('div',{class:'re'}, h('b',{},'En réalité'), h('p',{style:'margin:4px 0 0'},re)));
  const docQ = QUIZ.filter(q => q.t==='mc' && q.th==='doc');
  const docC = CARDS.filter(c => c.th==='doc');
  view.replaceChildren(
    h('section',{class:'panel'},
      h('p',{class:'eyebrow'},'Document 2'), h('h3',{},'La propagande d\'Auguste : les Res Gestae et le denier'),
      h('p',{class:'muted'},'Deux documents, une même mission : montrer qu\'Auguste respecte la République alors qu\'il détient tous les pouvoirs.'),
      h('div',{class:'two'},
        h('div',{class:'id'}, h('h4',{},'Les Res Gestae'), h('ul',{}, ...['Écrites par Auguste lui-même','Texte autobiographique, sorte de testament','Ier siècle','Pour son héritier, mais aussi pour convaincre tous les Romains'].map(x=>h('li',{},x)))),
        h('div',{class:'id'}, h('h4',{},'Le denier d\'argent'), h('ul',{}, ...['Colonia Patricia (Cordoue)','19-18 av. J.-C.','Avers : buste d\'Octave + surnoms','Revers : char triomphal + S.P.Q.R.'].map(x=>h('li',{},x)))))),
    h('section',{class:'panel'}, h('h3',{},'Le denier, pièce par pièce'), box, expl),
    h('section',{class:'panel'}, h('h3',{},'La phrase clé'),
      h('blockquote',{class:'q'},'« supérieur à tous les autres par la dignité et l\'autorité, mais [il n\'avait] pas de pouvoir plus grand que celui de [ses] collègues »'),
      h('p',{class:'muted'},'Extrait des Res Gestae : c\'est l\'idée n° 2.')),
    h('section',{class:'panel'}, h('h3',{},'3 idées de propagande : apparence et réalité'),
      idea(1,'Le Sénat et le peuple romain (S.P.Q.R.) : il respecte les institutions.','Il domine le Sénat.'),
      idea(2,'Il est au même niveau que ses collègues.','Princeps, imperator, tribun à vie : il a tous les pouvoirs.'),
      idea(3,'Il a servi la République : bénéfice collectif, non individuel.','Il est le seul détenteur du pouvoir ; Tibère reprend tout à sa mort.')),
    h('section',{class:'panel'}, h('h3',{},'Teste-toi sur le Doc 2'),
      h('div',{class:'row'},
        h('button',{class:'btn',onclick:()=>practice('Doc 2 · QCM',(el,d)=>runQuiz(el,weightedQuiz(docQ,Math.min(10,docQ.length)),d))},'QCM apparence ou réalité'),
        h('button',{class:'btn ghost',onclick:()=>practice('Doc 2 · cartes',(el,d)=>{ runCards(el,pickCards(docC,12,12),d); keyHandler = el._key; })},'Flashcards Doc 2'),
        h('button',{class:'btn ghost',onclick:()=>practice('Doc 2 · rédiger',(el,d)=>runWrite(el,WRITES[0],d))},'Rédiger sur le Doc 2'))));
}

const TABS = [['today','Aujourd\'hui',viewToday],['train','S\'entraîner',viewTrain],['doc','Doc 2',viewDoc],['plan','Plan du cours',viewPlan],['prog','Progrès',viewProg]];
function renderTab(){ (TABS.find(t=>t[0]===tab)||TABS[0])[2](); }
function renderTabs(){
  $('#tabs').replaceChildren(...TABS.map(([k,l]) => h('button',{class:'tab',role:'tab','aria-selected':String(tab===k),onclick:()=>{ if (busy){ busy=false; keyHandler=null; } tab=k; renderAll(); }}, l)));
}
function renderAll(){ renderTop(); renderTabs(); renderTab(); }

const local = loadLocal(); if (local) S = Object.assign(S, local);
renderAll();
initDb();
})();
</script>
